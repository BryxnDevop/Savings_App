# Solo para extraer los datos de Ahorra+ 3.2 antes de pasar a Supabase.
# Mismo nombre de volumen que la versión anterior. No usar down -v.
name: ahorra-plus
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahorra}
      POSTGRES_DB: ${POSTGRES_DB:-ahorra_plus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Usa --env-file .env.legacy con tu configuración anterior}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
