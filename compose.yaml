name: ahorra-plus
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL con Supabase en .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4173}
      APP_HOST: 0.0.0.0
      PORT: 4173
      NODE_ENV: production
      DB_SSL_CA_FILE: ${DB_SSL_CA_FILE:+/app/certs/supabase-ca.crt}
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:4173:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health',{headers:{host:new URL(process.env.APP_ORIGIN).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
